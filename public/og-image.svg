<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">BRTK Mods — Minecraft mods and interactive projects</title>
  <desc id="description">Portfolio Bartosza Siadlaka: Minecraft mods, Java, Kotlin, JavaScript, RCON and AI projects.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b13" />
      <stop offset="1" stop-color="#0d1d31" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#7dd3fc" stroke-opacity=".08" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1010" cy="100" r="230" fill="#22d3ee" fill-opacity=".08" />
  <circle cx="1010" cy="100" r="150" fill="#818cf8" fill-opacity=".06" />
  <rect x="88" y="92" width="72" height="72" rx="18" fill="#22d3ee" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".45" />
  <path d="M124 113 143 130 124 147 105 130Z" fill="none" stroke="#67e8f9" stroke-width="5" />
  <text x="190" y="145" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">BRTK <tspan fill="#67e8f9">Mods</tspan></text>
  <text x="88" y="330" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">Minecraft mods.</text>
  <text x="88" y="410" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">Interactive worlds.</text>
  <text x="91" y="505" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="25">Java · Kotlin · JavaScript · RCON · AI</text>
  <text x="91" y="565" fill="#64748b" font-family="monospace" font-size="20">BRTKMods.com</text>
